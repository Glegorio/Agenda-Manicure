name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Mesma imagem do docker-compose.yml. Services sobem antes do checkout, então o
        # script de init não é montado: banco e extensões são criados nos passos abaixo.
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: agende
          POSTGRES_PASSWORD: agende
          POSTGRES_DB: agende_test
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agende -d agende_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TZ: UTC
      DATABASE_URL: postgresql://agende:agende@localhost:5432/agende_test?schema=public
      DATABASE_URL_TEST: postgresql://agende:agende@localhost:5432/agende_test?schema=public
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # versão vem de "packageManager" no package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Preparar banco de teste (extensões)
        env:
          PGPASSWORD: agende
        run: |
          psql -h localhost -U agende -d agende_test -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS btree_gist;' \
            -c 'CREATE EXTENSION IF NOT EXISTS citext;'

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build
