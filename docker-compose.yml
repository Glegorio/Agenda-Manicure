# Postgres local para desenvolvimento e testes.
# Bancos: `agende` (dev) e `agende_test` (testes de integração), criados por docker/postgres/init.
# Porta do host 5433 por padrão (evita conflito com Postgres nativo na 5432); ajuste com POSTGRES_PORT.
# Scripts de init só rodam com volume vazio: após mudá-los, `docker compose down -v`.
services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: agende
      POSTGRES_PASSWORD: agende
      POSTGRES_DB: agende
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agende -d agende_test']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
