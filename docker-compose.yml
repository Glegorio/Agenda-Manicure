# Postgres local para desenvolvimento e testes.
# A tarefa 0.3 do roadmap pode ajustar este arquivo.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agende
      POSTGRES_PASSWORD: agende
      POSTGRES_DB: agende
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agende -d agende"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
